
services:
  postgres:
    image: postgres:16-alpine
    container_name: businessbud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-businessbud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-businessbud_secret}
      POSTGRES_DB: ${POSTGRES_DB:-businessbud_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-businessbud} -d ${POSTGRES_DB:-businessbud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
